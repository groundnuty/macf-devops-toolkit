# Observability bundle on issue/PR close — calls hack/observability-snapshot.sh
# on the VM via SSH, pushes the resulting JSON bundle to the archive repo,
# posts a summary comment on the closed issue/PR. Per DR-002.
#
# OPERATOR SETUP: see docs/observability-bundle-setup.md (single canonical
# runbook covering Tailscale OAuth, SSH key, archive-repo deploy key, and
# first-run validation). Until all three setup steps are configured, the
# workflow fires but fails at the first missing-secret step with clear
# errors. No silent failures.

name: observability-snapshot

on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]

# Permissions: workflow needs to comment on the closed issue/PR.
# Other writes (archive-repo push, secret reads) happen via dedicated keys.
permissions:
  issues: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (this repo's snapshot script lives here)
        uses: actions/checkout@v4

      # Fail-fast precheck (per #57). Catches the silent-fallback-hazard
      # class where a missing secret renders as empty-string at substitution
      # time and the downstream tool surfaces a misleading auth-fail error
      # instead of the actual root cause. See docs/observability-bundle-setup.md
      # for the runbook documenting these inputs.
      - name: Precheck — required secrets + variables present
        env:
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_SECRET:    ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          OBS_RUNNER_SSH_KEY:        ${{ secrets.OBS_RUNNER_SSH_KEY }}
          ARCHIVE_DEPLOY_KEY:        ${{ secrets.ARCHIVE_DEPLOY_KEY }}
          OBS_RUNNER_HOST:           ${{ vars.OBS_RUNNER_HOST }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${TAILSCALE_OAUTH_CLIENT_ID:-}" ] && missing+=("TAILSCALE_OAUTH_CLIENT_ID (secret)")
          [ -z "${TAILSCALE_OAUTH_SECRET:-}" ]    && missing+=("TAILSCALE_OAUTH_SECRET (secret)")
          [ -z "${OBS_RUNNER_SSH_KEY:-}" ]        && missing+=("OBS_RUNNER_SSH_KEY (secret)")
          [ -z "${ARCHIVE_DEPLOY_KEY:-}" ]        && missing+=("ARCHIVE_DEPLOY_KEY (secret)")
          [ -z "${OBS_RUNNER_HOST:-}" ]           && missing+=("OBS_RUNNER_HOST (variable)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required workflow inputs:"
            for m in "${missing[@]}"; do echo "::error::  - $m"; done
            echo "::error::See docs/observability-bundle-setup.md for the runbook."
            exit 1
          fi
          echo "✓ All 4 secrets + 1 variable present"

      - name: Tailscale up (join tailnet so we can reach the cluster VM)
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci-runner

      # silent-fallback-hazards.md Instance 11: NEVER trust a retry-wrapping third-party
      # action's exit code as evidence its own internal retries succeeded. On macf#461
      # `tailscale up` returned `Status 400: requested tags [...] are invalid or not
      # permitted` on all five internal retries and the action STILL exited 0 — the runner
      # never joined, the step was green, and the failure resurfaced far downstream as
      # "Tempo unreachable", costing an extra diagnostic cycle aimed at the wrong layer.
      # (A tag/ACL mismatch has also been observed failing loudly — which branch you get is
      # exactly what this assert stops you from having to know.)
      - name: Verify tailnet is actually up
        run: |
          tailscale status --json | jq -e '.BackendState == "Running"' >/dev/null \
            || { echo "::error::tailnet did not come up — BackendState != Running."; \
                 echo "::error::The connect action may have exhausted its retries and exited 0 anyway"; \
                 echo "::error::(e.g. a tag/ACL mismatch returns Status 400 on every attempt)."; \
                 echo "::error::Check that the OAuth client is permitted to advertise the tag in 'tags:' above."; \
                 tailscale status || true; exit 1; }
          echo "✓ tailnet up (BackendState=Running)"

      - name: Install SSH key for VM access
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.OBS_RUNNER_SSH_KEY }}" > ~/.ssh/obs-runner
          chmod 600 ~/.ssh/obs-runner
          # tailnet hostname → known_hosts via ssh-keyscan over Tailscale
          ssh-keyscan -H "${{ vars.OBS_RUNNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Determine issue/PR number + repo
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            echo "kind=issue" >> "$GITHUB_OUTPUT"
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "kind=pr" >> "$GITHUB_OUTPUT"
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi
          echo "repo=${{ github.repository }}" >> "$GITHUB_OUTPUT"

      # Derive actor + time window HERE, on the runner, instead of on the VM.
      # The VM has no `gh` and no GitHub credentials — and shouldn't: shipping a
      # token over SSH would put it in the VM's process list, and installing gh
      # there adds a credentialed dependency to a box whose whole job is to hold
      # telemetry. The runner already has GITHUB_TOKEN natively, so do the GitHub
      # work where the credentials already live and hand the VM only derived,
      # non-secret values (the script's `time-window` mode is exactly that
      # primitive; `github-issue` mode is its gh-dependent convenience wrapper).
      - name: Derive actor + time window (needs gh; runs on the runner, not the VM)
        id: window
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ steps.ref.outputs.repo }}
          NUMBER: ${{ steps.ref.outputs.number }}
        run: |
          set -euo pipefail
          # ONE implementation, shared with the script's github-issue mode — the
          # inline copy this replaces had to be kept in lockstep by hand, and had
          # already drifted: it asked for `--json closedBy`, which this gh rejects
          # as an unknown field, behind `2>/dev/null || true`. The error was
          # swallowed and it ALWAYS fell through to the author fallback, which
          # looked right only because a self-filed issue's author is usually its
          # closer. The helper reads the REST timeline instead (#177).
          OUT=$(bash environments/macf/hack/derive-snapshot-window.sh \
                  --repo "$REPO" --issue "$NUMBER")
          printf '%s\n' "$OUT"
          printf '%s\n' "$OUT" >> "$GITHUB_OUTPUT"
          # Surface a clamp as a workflow annotation too — a bundle covering less
          # than the issue's full history must never be a silent detail.
          if printf '%s\n' "$OUT" | grep -q '^clamped=1$'; then
            KEPT=$(printf '%s\n' "$OUT" | sed -n 's/^clusters_kept=//p')
            TOTAL=$(printf '%s\n' "$OUT" | sed -n 's/^clusters_total=//p')
            echo "::warning::Activity spans more than --max-span; bundling the most recent $KEPT of $TOTAL activity clusters. Earlier activity is EXCLUDED (recorded in manifest.json)."
          fi

      # The workflow used to run whatever was checked out at ~/repos/... on the VM
      # — the OPERATOR's working copy. It was sitting on a feature branch 70
      # commits behind main, so every change merged to the snapshot script
      # silently did not apply, and the run failed with `unknown arg:
      # --window-provenance` for a flag that had been on main for hours. Nothing
      # anywhere asserted "the VM is running the code this workflow just merged."
      #
      # So: CI gets its OWN checkout, pinned to this run's commit, in a CI-owned
      # path that never touches the operator's working tree. Public repo, so the
      # clone needs no credentials on the VM (see #176 — we keep the VM
      # credential-free on purpose).
      - name: Sync the VM's CI checkout to THIS commit
        env:
          VM_HOST: ${{ vars.OBS_RUNNER_HOST }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/obs-runner ubuntu@"$VM_HOST" "set -e
            CI_DIR=\$HOME/.cache/macf-obs-snapshot
            if [ ! -d \$CI_DIR/.git ]; then
              git clone --quiet https://github.com/${{ github.repository }}.git \$CI_DIR
            fi
            cd \$CI_DIR
            git fetch --quiet origin main
            git checkout --quiet --detach origin/main
            echo \"VM CI checkout now at: \$(git rev-parse --short HEAD) \$(git log -1 --pretty=%s)\""

          # Pattern A at this boundary: assert the VM-side script actually
          # SUPPORTS what we are about to send it, rather than trusting that the
          # sync worked. A version mismatch must fail HERE, naming the cause —
          # not three steps later as an opaque `unknown arg`.
          ssh -i ~/.ssh/obs-runner ubuntu@"$VM_HOST" \
            "grep -q -- '--window-provenance' \$HOME/.cache/macf-obs-snapshot/environments/macf/hack/observability-snapshot.sh" \
            || { echo "::error::The VM's CI checkout does not support --window-provenance."; \
                 echo "::error::Its copy of observability-snapshot.sh is older than this workflow."; \
                 echo "::error::The sync step above did not produce the expected code — check it before anything else."; \
                 exit 1; }
          echo "✓ VM-side script supports the flags this run will pass"

      - name: Run snapshot script on the VM via SSH
        env:
          REPO: ${{ steps.ref.outputs.repo }}
          NUMBER: ${{ steps.ref.outputs.number }}
          KIND: ${{ steps.ref.outputs.kind }}
          VM_HOST: ${{ vars.OBS_RUNNER_HOST }}
        run: |
          # Bundle path on the VM: /tmp/obs-bundle-<repo-slug>-<N>/
          REMOTE_BUNDLE="/tmp/obs-bundle-${REPO//\//-}-${NUMBER}"
          # Run the script. The VM has the macf-devops-toolkit repo cloned at
          # ~/repos/groundnuty/macf-devops-toolkit (per the operator's layout).
          # Optional --grafana-base override via repo var (vars.GRAFANA_BASE).
          # Default in the script is http://127.0.0.1:3000 which only
          # resolves on the VM or via operator's port-forward. For sister-
          # repo propagation where issue-closers are other agents
          # (science-agent, code-agent, testers) without port-forward
          # access, set vars.GRAFANA_BASE to the cluster's external URL
          # (or to a tailnet-reachable Grafana endpoint if exposed).
          GRAFANA_FLAG=""
          if [ -n "${{ vars.GRAFANA_BASE }}" ]; then
            GRAFANA_FLAG="--grafana-base '${{ vars.GRAFANA_BASE }}'"
          fi
          ssh -i ~/.ssh/obs-runner ubuntu@"$VM_HOST" \
            "cd \$HOME/.cache/macf-obs-snapshot/environments/macf && \
             devbox run -q -- bash hack/observability-snapshot.sh \
               --mode time-window \
               --filter-key 'gen_ai.agent.name' \
               --filter-value '${{ steps.window.outputs.filter_value }}' \
               --start '${{ steps.window.outputs.start }}' \
               --end '${{ steps.window.outputs.end }}' \
               --window-provenance '${{ steps.window.outputs.provenance_json }}' \
               --out-dir '$REMOTE_BUNDLE' \
               $GRAFANA_FLAG"
          # scp the bundle back to the runner. Bundle path `./bundle/` is
          # runner-relative; safe on github-hosted runners (fresh workspace
          # per run, no concurrent-workflow collision risk). If we ever
          # switch to self-hosted / persistent runners, this becomes a
          # collision concern + would need per-issue subdirs.
          scp -i ~/.ssh/obs-runner -r ubuntu@"$VM_HOST":"$REMOTE_BUNDLE" ./bundle/
          # Cleanup VM-side
          ssh -i ~/.ssh/obs-runner ubuntu@"$VM_HOST" "rm -rf '$REMOTE_BUNDLE' || true"
          ls -la ./bundle/

      - name: Push bundle to archive repo
        env:
          REPO: ${{ steps.ref.outputs.repo }}
          NUMBER: ${{ steps.ref.outputs.number }}
        run: |
          # Clone archive repo using deploy key
          mkdir -p ~/.ssh
          echo "${{ secrets.ARCHIVE_DEPLOY_KEY }}" > ~/.ssh/archive-deploy
          chmod 600 ~/.ssh/archive-deploy
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/archive-deploy" \
            git clone git@github.com:groundnuty/macf-observability-archive.git ~/archive
          # Place the bundle at runs/work/<owner>/<repo>/<N>/
          OWNER_REPO="${REPO//\//-}"
          DEST_DIR=~/archive/work/$REPO/$NUMBER
          mkdir -p "$DEST_DIR"
          cp -r ./bundle/* "$DEST_DIR/"
          # Commit + push
          cd ~/archive
          git config user.name "macf-devops-agent[bot]"
          git config user.email "278898590+macf-devops-agent[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit (bundle empty?)"
          else
            git commit -m "obs-bundle: $REPO#$NUMBER"
            GIT_SSH_COMMAND="ssh -i ~/.ssh/archive-deploy" git push
          fi

      - name: Post summary comment on closed issue/PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ steps.ref.outputs.repo }}
          NUMBER: ${{ steps.ref.outputs.number }}
          KIND: ${{ steps.ref.outputs.kind }}
        run: |
          # Read the bundle's manifest + grafana-urls files for summary
          MANIFEST=$(cat ./bundle/manifest.json)
          GRAFANA=$(cat ./bundle/grafana-urls.json)

          # Render a markdown comment
          BODY=$(cat <<EOF
          ## 📊 Observability bundle

          **Window**: $(echo "$MANIFEST" | jq -r '.window.start_iso') → $(echo "$MANIFEST" | jq -r '.window.end_iso')  ($(echo "$MANIFEST" | jq -r '.window.duration_seconds')s)
          **Filter**: \`$(echo "$MANIFEST" | jq -r '.filter.key')\` = \`$(echo "$MANIFEST" | jq -r '.filter.value')\`

          ### Summary
          | Backend | Count |
          |---|---|
          | Tempo | $(echo "$MANIFEST" | jq -r '.summary.tempo_traces') traces |
          | Langfuse | $(echo "$MANIFEST" | jq -r '.summary.langfuse_traces') traces |
          | Loki | $(echo "$MANIFEST" | jq -r '.summary.loki_streams') streams |
          | ClickHouse-logs | $(echo "$MANIFEST" | jq -r '.summary.clickhouse_rows') rows |
          | Prometheus | $(echo "$MANIFEST" | jq -r '.summary.prometheus_series') series |

          ### Drill-in (Grafana, pre-filtered)
          - 🔍 [Tempo]($(echo "$GRAFANA" | jq -r '.tempo'))
          - 📜 [Loki]($(echo "$GRAFANA" | jq -r '.loki'))
          - 📈 [Prometheus]($(echo "$GRAFANA" | jq -r '.prometheus'))
          - 💬 [Langfuse UI]($(echo "$GRAFANA" | jq -r '.langfuse_native_ui'))

          ### Full bundle
          [\`groundnuty/macf-observability-archive/work/$REPO/$NUMBER/\`](https://github.com/groundnuty/macf-observability-archive/tree/main/work/$REPO/$NUMBER)

          🤖 Auto-generated by [observability-snapshot.yml](.github/workflows/observability-snapshot.yml) — DR-002
          EOF
          )

          if [ "$KIND" = "issue" ]; then
            gh issue comment "$NUMBER" --repo "$REPO" --body "$BODY"
          else
            gh pr comment "$NUMBER" --repo "$REPO" --body "$BODY"
          fi
