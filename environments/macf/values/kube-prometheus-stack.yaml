# kube-prometheus-stack helm values
# Chart: 84.0.0 released 2026-04-23 (Grafana v11 -> v12 major bump)
#   https://github.com/prometheus-community/helm-charts/releases/tag/kube-prometheus-stack-84.0.0
# Bundles Prometheus + Grafana + Alertmanager + node-exporter + kube-state-metrics
# plus ~50 preset dashboards and alert rules.

# --- k3s single-node control-plane disables -----------------------------------
# k3s collapses these components into a single binary that does not expose
# /metrics on standard ports. Alternative is --kube-*-arg='bind-address=0.0.0.0'
# at k3s install time; for a spike we disable the panels instead.
kubeScheduler:         {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy:             {enabled: false}
kubeEtcd:              {enabled: false}

# --- Grafana ------------------------------------------------------------------
grafana:
  # v12 default in 84.0.0. If a dashboard plugin breaks after install,
  # Grafana 12 migration notes: https://grafana.com/docs/grafana/latest/upgrade-guide/upgrade-v12.0/
  enabled: true
  # --- Password-seeding semantics (READ BEFORE DEBUGGING A GRAFANA 401) -------
  # `adminPassword: ""` makes the chart GENERATE a random password into the
  # `kube-prom-stack-grafana` Secret's `.data.admin-password` on every render.
  # `GF_SECURITY_ADMIN_PASSWORD` — the pod env var this chart sources from
  # that same Secret — only seeds Grafana's `admin` row in the DB at FIRST
  # DATABASE INIT. The PVC persists the user table across every later
  # restart/upgrade, so once an `admin` row exists, the env var is read once
  # at container start and never resyncs the DB again.
  #
  # The grafana chart nominally protects against this via a `lookup()` call
  # in its Secret template (reuse the live Secret's value instead of
  # generating a new one, so plain `helm upgrade` is stable). **That guard is
  # INERT under ArgoCD**: ArgoCD renders Helm sources via `helm template`
  # (client-side, no live cluster access), under which `lookup()` always
  # returns empty — so every ArgoCD render (re)generates a FRESH random
  # password, and with this app's `syncPolicy.automated.selfHeal: true`, that
  # fresh value gets reapplied to the Secret whenever ArgoCD detects the
  # (perpetual) drift. The DB, meanwhile, never moves — so the Secret and the
  # DB can and do diverge. (Same class of problem `apps/argocd-app.yaml`
  # already works around for `argocd-secret` via `ignoreDifferences` — no
  # equivalent exists yet for this Secret.)
  #
  # SYMPTOM: this bug looks like nothing is wrong. Pod env matches the
  # Secret, `/api/health` is green, the deployment is internally consistent —
  # the ONLY signal is `POST /login` 401ing with the password `make
  # grafana-password` just printed. A 401 with an otherwise-consistent
  # secret/pod-env IS this bug (devops-toolkit#183 has the forensics).
  #
  # REMEDY: `make grafana-reset-password` reconciles the DB to whatever the
  # Secret currently holds (`grafana cli admin reset-admin-password`, in-pod,
  # password piped via stdin — never argv). Safe + idempotent; a no-op if
  # they already match. This does not stop the Secret from drifting again on
  # a future ArgoCD sync — it just makes recovery a one-command operation
  # instead of a forensic investigation. Retrieve the (now-true) password
  # with `make grafana-password`.
  adminPassword: ""
  service:
    type: ClusterIP
  persistence:
    enabled: true
    storageClassName: local-path  # k3s default
    size: 5Gi
  # Disable the `init-chown-data` init container. It tries to chown the entire
  # /var/lib/grafana tree as root+CAP_CHOWN, which races with the live Grafana
  # writing PDF/CSV/PNG caches (drwx--S--- subdirs owned by 472). Symptom: new
  # Grafana rollouts go Init:Error on `chown: /var/lib/grafana/{png,csv,pdf}:
  # Permission denied` and the new pod never becomes Ready. Relying on
  # fsGroup (default 472 in chart's podSecurityContext) + the
  # `fsGroupChangePolicy: OnRootMismatch` kubelet default (k8s >= 1.23) means
  # kubelet handles volume ownership at mount time with no race. Refs #7.
  initChownData:
    enabled: false
  # Plugins installed at startup. The ClickHouse datasource plugin is needed
  # for the parallel logs backend in #19c (Grafana queries against the
  # `logs` database in langfuse-clickhouse). Plugin pulls from grafana.com on
  # pod start; no offline image needed for dev.
  plugins:
    - grafana-clickhouse-datasource
  sidecar:
    # Default ON; listed here for clarity. This sidecar watches for ConfigMaps
    # labeled `grafana_datasource: "1"` and registers them as datasources.
    # Our Tempo datasource ConfigMap (manifests/tempo-grafana-datasource.yaml)
    # uses this label.
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL  # Tempo ConfigMap lives in `tempo` ns, not `monitoring`
    dashboards:
      enabled: true
      searchNamespace: ALL

# --- Prometheus ---------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          resources:
            requests:
              storage: 20Gi

# --- Alertmanager -------------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          resources:
            requests:
              storage: 2Gi
