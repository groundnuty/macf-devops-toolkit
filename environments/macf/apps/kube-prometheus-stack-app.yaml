apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd-applications
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # kube-prometheus-stack's post-install admission-webhook setup creates
    # six resources as helm hooks (SA, Job, ClusterRole, ClusterRoleBinding,
    # Role, RoleBinding named `kube-prom-stack-kube-prome-admission`).
    # They persist in cluster after the hook runs but are not in ArgoCD's
    # rendered manifest set — default behavior is "prune as extraneous",
    # which would delete the admission-webhook trust chain. `IgnoreExtraneous`
    # tells ArgoCD to leave unlisted cluster resources alone: no prune, no
    # OutOfSync status from them. Refs #6.
    argocd.argoproj.io/compare-options: IgnoreExtraneous
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: operations
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 84.0.0
      helm:
        releaseName: kube-prom-stack
        valueFiles:
          - $values/environments/macf/values/kube-prometheus-stack.yaml
        skipCrds: false
    - repoURL: https://github.com/groundnuty/macf-devops-toolkit.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # Don't fight the chart's generated admin credential.
  #
  # NOTE on apps/argocd-app.yaml's similar-looking block for `argocd-secret`:
  # it is NOT a working precedent for this, and copying its shape is what made
  # the first attempt fail. That block carries no `RespectIgnoreDifferences`
  # either — so it is silently ineffective, or it survives for a different
  # reason (argocd populates `admin.password` at runtime rather than the chart
  # rendering a value to overwrite). Matching its shape without checking its
  # mechanism cost a merge-and-regress cycle here.
  #
  # `grafana.adminPassword: ""` makes the chart GENERATE a random password into
  # this Secret on render. `GF_SECURITY_ADMIN_PASSWORD` seeds the Grafana DB
  # only at FIRST database init, and the PVC outlives re-renders — so every
  # regeneration leaves the published password authenticating against nothing,
  # silently, until someone tries to log in and gets a 401 from a deployment
  # that is otherwise perfectly consistent (#183).
  #
  # Observed at least twice, once inside a ~2-day window. Without this,
  # `make grafana-reset-password` has to be re-run after each one.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: kube-prom-stack-grafana
      jsonPointers:
        - /data/admin-password
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # LOAD-BEARING for the ignoreDifferences block above, and NOT optional.
      # `ignoreDifferences` alone only affects DIFFING — whether ArgoCD reports
      # the app OutOfSync. A sync still applies the rendered manifest, so the
      # chart's freshly-generated admin-password overwrites the live one and
      # login breaks again. RespectIgnoreDifferences makes the SYNC honour the
      # ignore rules too.
      #
      # Verified empirically (#183, 2026-09-02): with ignoreDifferences and
      # WITHOUT this flag, a forced sync changed the password hash and login
      # 401'd. With this flag added, the same forced sync left it byte-identical
      # and login stayed 200.
      - RespectIgnoreDifferences=true
