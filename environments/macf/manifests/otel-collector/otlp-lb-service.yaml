# LoadBalancer Service for the central OpenTelemetry Collector's OTLP receivers.
#
# Why a SECOND service alongside the operator-managed `central-collector`:
# the operator creates a ClusterIP service (needed for in-cluster clients like
# the Grafana Tempo datasource or future Langfuse exporter). For external
# (host-side) testers + agents to push traces without `kubectl port-forward`,
# we need a LoadBalancer service.
#
# Post-DR-004 (native k3s on the dedicated monitoring VM): k3s ServiceLB
# (klipper) binds this Service's ports (4317/4318) on EVERY host interface —
# private IP, localhost, AND the tailnet — via iptables. No k3d serverlb, no
# nginx proxy, no host-port mapping file, and no `+10000` offset (the offset
# was a k3d-VM compose-collision workaround, now obsolete). Reach it at the
# NATIVE ports:
#   orzech-dev-agents-monitoring.tail491af.ts.net:4317  (OTLP gRPC)
#   orzech-dev-agents-monitoring.tail491af.ts.net:4318  (OTLP HTTP)
#
# Routing chain host → pod (native k3s):
#   <any-host-interface>:4317
#     → svclb-central-collector-lb DaemonSet pod (klipper, hostPort 4317)
#       → this Service's ClusterIP
#         → pod label-selector → central-collector Deployment pods
#
# Labels mirror the operator-created Service's selector — kept in sync with
# the chart-default labels generated by the opentelemetry-operator when it
# reconciles an OpenTelemetryCollector CR named `central` in ns/otel.

apiVersion: v1
kind: Service
metadata:
  name: central-collector-lb
  namespace: otel
  labels:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/instance: otel.central
    app.kubernetes.io/managed-by: opentelemetry-operator
    app.kubernetes.io/part-of: opentelemetry
    macf.dev/role: stable-otlp-ingress
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/instance: otel.central
    app.kubernetes.io/managed-by: opentelemetry-operator
    app.kubernetes.io/part-of: opentelemetry
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
