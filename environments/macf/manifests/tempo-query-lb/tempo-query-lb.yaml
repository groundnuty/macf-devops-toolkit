# LoadBalancer Service for Tempo's query API (:3200), so the host can reach
# it WITHOUT `make pf-tempo`. Mirrors `../otel-collector/otlp-lb-service.yaml`
# (the OTLP-ingress equivalent for the collector).
#
# Why a SECOND service alongside the chart-created `tempo` ClusterIP:
# the grafana-community/tempo chart ships a ClusterIP service (right for
# in-cluster clients — the Grafana datasource, smoke.sh via port-forward).
# A ClusterIP is not host-reachable; for any host-context consumer to run
# TraceQL without a kubectl tunnel, we need a LoadBalancer service.
#
# Post-DR-004 (native k3s on the dedicated monitoring VM): k3s ServiceLB
# (klipper) binds this Service's port (3200) on EVERY host interface — private
# IP, localhost, AND the tailnet — via iptables. No k3d serverlb and no
# `:13200` offset (the offset was a k3d-VM compose-collision workaround, now
# obsolete). Reach it at the NATIVE port:
#   orzech-dev-agents-monitoring.tail491af.ts.net:3200  (Tempo query API)
#
# Routing chain host → pod (native k3s; identical shape to the collector LB):
#   <any-host-interface>:3200
#     → svclb-tempo-query-lb DaemonSet pod (klipper, hostPort 3200)
#       → this Service's ClusterIP
#         → pod label-selector → tempo StatefulSet pod
#
# Replaces the operator-occasional `make pf-tempo` with an always-on host
# endpoint. Filed because Tempo query became a recurring need (Phase 5 A2A
# observations + future paper-evidence passes), so the "port-forward on
# demand" assumption no longer held. See groundnuty/macf#368.
#
# Selector mirrors the chart-default labels on the tempo StatefulSet pods
# (`app.kubernetes.io/name=tempo` + `app.kubernetes.io/instance=tempo`).
apiVersion: v1
kind: Service
metadata:
  name: tempo-query-lb
  namespace: tempo
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: tempo
    macf.dev/role: stable-tempo-query
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: tempo
  ports:
    - name: tempo-query
      port: 3200
      targetPort: 3200
      protocol: TCP
