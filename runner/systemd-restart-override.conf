# systemd drop-in override — auto-restart the self-hosted runner on ANY crash/exit.
# devops-toolkit#90. GitHub's svc.sh-generated unit has NO Restart= directive, so a
# transient failure (network blip, broker SocketException, OOM) kills the runner
# PERMANENTLY while the VM stays up — no oversight, no restore (observed 2026-07-01:
# a Tailscale/network blip during the fleet upgrade threw
# `SocketException (125): Operation canceled` on the broker connection → listener
# exited → systemd left it dead). systemd IS the runner's supervisor; this configures
# its restart policy (the right layer — not a second watchdog on top).
#
# Install (survives svc.sh regen — drop-ins augment the generated unit):
#   SVC=$(systemctl list-units --type=service | grep -oE 'actions\.runner\.[^ ]+\.service' | head -1)
#   sudo mkdir -p "/etc/systemd/system/${SVC}.d"
#   sudo cp runner/systemd-restart-override.conf "/etc/systemd/system/${SVC}.d/restart.conf"
#   sudo systemctl daemon-reload && sudo systemctl restart "$SVC"
# Verify:  systemctl show "$SVC" -p Restart -p RestartUSec -p StartLimitIntervalUSec
#          → Restart=always
[Unit]
# Don't let systemd give up after repeated restarts (StartLimit* are [Unit] directives):
# a flapping runner is still better than a dead one; the underlying cause surfaces in the
# runner _diag logs, and Restart=always keeps trying.
StartLimitIntervalSec=0

[Service]
# Restart on every stop reason (crash, non-zero exit, clean exit, signal) — a routing
# runner should always come back; a clean exit here is never intentional.
Restart=always
RestartSec=5
