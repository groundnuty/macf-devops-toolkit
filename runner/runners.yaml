# runner/runners.yaml — the REGISTRY of self-hosted runners we operate, by fleet.
#
# The documented inventory + the source the runner Makefile aggregates. Add a runner =
# ONE entry here; every aggregate target (verify/status across a fleet or all) picks it
# up automatically — config-driven, so there's NO per-repo Makefile-target drift (the
# same lesson as MACF_TRUSTED_ACTORS + the DR-007 fleet-enumeration: don't hand-maintain
# per-repo lists — derive from one source).
#
# A "fleet" == its registry repo (DR-007). Runners are per-repo (user account => no org
# scope). One VM hosts all of them.
fleets:
  - name: macf
    registry: groundnuty/groundnuty
    runners:
      - repo: groundnuty/macf-science-agent
        visibility: private
        status: proven          # isolation-proven 2026-07-01 ("Connected → Listening for Jobs")
        note: safe first spike; no origin-routing dependency (private = no anonymous fork surface)
      # - repo: groundnuty/macf
      #   visibility: public
      #   status: blocked
      #   note: needs macf-actions#59 origin-routing to land BEFORE registering (public repo)
      # - repo: groundnuty/macf-actions
      #   visibility: public
      #   status: blocked
      #   note: same — origin-routing first
      # - repo: groundnuty/macf-devops-toolkit
      #   visibility: public
      #   status: blocked
      #   note: same — origin-routing first
