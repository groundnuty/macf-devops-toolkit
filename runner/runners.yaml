# runner/runners.yaml — the REGISTRY of self-hosted runners we operate, by fleet.
#
# THE single source of truth. The Makefile GENERATES a `runner-<name>` target per entry
# here (via $(eval) — no hardcoding) + a `fleet-<name>` target per fleet; shell tab-
# completion that reads the make database (bash-completion's default; zsh with
# `zstyle ':completion:*:make:*:targets' call-command true`) then lists them for free —
# no custom completion script. The reconcile / verify / var-copy scripts also read this
# file. So: add a runner = ONE entry here → its target, its tab-completion, and its
# var-copy all appear automatically. Nothing hardcoded (same anti-drift as
# MACF_TRUSTED_ACTORS + the DR-007 fleet-enumeration).
#
# A "fleet" == its registry repo (DR-007). Runners are per-repo (user account => no org
# scope). One VM hosts all of them. Per fleet:
#   var_source  — the repo whose shared vars a new runner-repo COPIES. Set the actors
#                 allowlist ONCE there; every runner-repo copies from + is verified
#                 against it (kills the "set MACF_TRUSTED_ACTORS in N repos" drift).
#   shared_vars — the GitHub Actions variables copied from var_source to each runner-repo.
#
# MULTI-RUNNER-PER-HOST: each runner below installs ISOLATED under
# /mnt/volume1/macf-runners/<name> (the big volume — root disk is 84% full; override via
# MACF_RUNNER_BASE), computed by reconcile-runner.sh from the `name` field. ALL runners
# SHARE one action-archive-cache (/mnt/volume1/macf-runners/action-archive-cache — Lever B,
# the router actions are identical across repos) + the ONE low-priv macf-runner OS user
# (set up once per VM by setup-macf-runner-user.sh, not per-runner). Service names don't
# collide either — svc.sh derives actions.runner.<owner>-<repo>.<name>.service per repo.
fleets:
  - name: macf
    registry: groundnuty/groundnuty
    var_source: groundnuty/macf-devops-toolkit
    shared_vars: [MACF_TRUSTED_ACTORS]
    runners:
      - name: macf-science-agent
        repo: groundnuty/macf-science-agent
        visibility: private
        status: live            # non-ephemeral systemd service (svc.sh), listening+serving 2026-07-01
        note: safe first spike; private = no anonymous fork surface. Non-ephemeral (survives jobs);
              origin-routing (macf-actions#60) merged + MACF_TRUSTED_ACTORS set → serves trusted routing.
      - name: macf-devops-toolkit
        repo: groundnuty/macf-devops-toolkit
        visibility: private
        status: ready            # next in queue — installs onto /mnt/volume1/macf-runners/macf-devops-toolkit
        note: this repo's own routing runs here. private = no anonymous fork surface, same as
              macf-science-agent. `make runner-macf-devops-toolkit` to stand up.
