# runner/runners.yaml — the REGISTRY of self-hosted runners we operate, by fleet.
#
# THE single source of truth. The Makefile GENERATES a `runner-<name>` target per entry
# here (via $(eval) — no hardcoding) + a `fleet-<name>` target per fleet; shell tab-
# completion that reads the make database (bash-completion's default; zsh with
# `zstyle ':completion:*:make:*:targets' call-command true`) then lists them for free —
# no custom completion script. The reconcile / verify / var-copy scripts also read this
# file. So: add a runner = ONE entry here → its target, its tab-completion, and its
# var-copy all appear automatically. Nothing hardcoded (same anti-drift as
# MACF_TRUSTED_ACTORS + the DR-007 fleet-enumeration).
#
# A "fleet" == its registry repo (DR-007). Runners are per-repo (user account => no org
# scope). One VM hosts all of them. Per fleet:
#   var_source  — the repo whose shared vars a new runner-repo COPIES. Set the actors
#                 allowlist ONCE there; every runner-repo copies from + is verified
#                 against it (kills the "set MACF_TRUSTED_ACTORS in N repos" drift).
#   shared_vars — the GitHub Actions variables copied from var_source to each runner-repo.
#
# MULTI-RUNNER-PER-HOST: each runner below installs ISOLATED under
# /mnt/volume1/macf-runners/<name> (the big volume — root disk is 84% full; override via
# MACF_RUNNER_BASE), computed by reconcile-runner.sh from the `name` field. ALL runners
# SHARE one action-archive-cache (/mnt/volume1/macf-runners/action-archive-cache — Lever B,
# the router actions are identical across repos) + the ONE low-priv macf-runner OS user
# (set up once per VM by setup-macf-runner-user.sh, not per-runner). Service names don't
# collide either — svc.sh derives actions.runner.<owner>-<repo>.<name>.service per repo.
fleets:
  - name: macf
    registry: groundnuty/groundnuty
    var_source: groundnuty/macf-devops-toolkit
    shared_vars: [MACF_TRUSTED_ACTORS]
    runners:
      - name: macf-science-agent
        repo: groundnuty/macf-science-agent
        visibility: private
        status: live            # non-ephemeral systemd service (svc.sh), listening+serving 2026-07-01
        note: safe first spike; private = no anonymous fork surface. Non-ephemeral (survives jobs);
              origin-routing (macf-actions#60) merged + MACF_TRUSTED_ACTORS set → serves trusted routing.
      - name: macf-devops-toolkit
        repo: groundnuty/macf-devops-toolkit
        visibility: public      # CORRECTED 2026-07-03 — GitHub reports PUBLIC (was mislabeled private)
        status: live            # non-ephemeral svc.sh on /mnt/volume1/macf-runners/macf-devops-toolkit (2026-07-02)
        note: "PUBLIC repo. origin-routing (macf-actions#59) is NOT yet landed (OPEN), so
          self-hosted fork-safety currently rests ONLY on the repo native fork-PR-approval
          setting (operator-enabled). Once that lands, origin-routing is the defense-in-depth
          second layer. Flagged for operator review on the devops#90 thread."
      - name: macf-auditor-agent
        repo: groundnuty/macf-auditor-agent
        visibility: private
        status: live            # deployed 2026-07-04, non-ephemeral svc.sh on /mnt/volume1/macf-runners/macf-auditor-agent (private = no fork surface)
        note: "auditor routing runs here. private repo means no fork exposure, independent of
          macf-actions#59. Deploy with make runner-macf-auditor-agent (auto-mints token from
          operator gh creds; sudo for systemd)."
      - name: macf
        repo: groundnuty/macf
        visibility: public
        status: live            # deployed + ACTIVE 2026-07-04: registered (fork-PR-approval precheck passed),
                                 # macf pinned @v3.4.1 (macf#772 merged) so origin-routing is live + verified
                                 # (trusted actor -> this self-hosted runner; untrusted -> ubuntu-latest).
        note: "PUBLIC + highest-traffic repo. Two safety layers now exist: origin-routing
          (macf-actions#60, in v3.4.x) plus the deploy-side fork-PR-approval precheck (#161).
          ORDER MATTERS: register here FIRST (inert on macf's current @v3.3.0 pin, no job targets
          self-hosted yet), THEN merge macf#769 (the @v3.4.1 workflow bump) to activate — registering
          AFTER the bump would queue trusted routing with no runner. Fork-PR-approval must be
          all_external_contributors; the precheck (#161) enforces it at register time."
  # ── CV fleet (Curriculum Vitae) — cv-architect. All private. Added 2026-07-05. ──
  # Registration uses the OPERATOR's gh creds (bot not installed on these repos); private =
  # fork-precheck SKIPs. For origin-routing to self-HOST (not just register-inert), set
  # MACF_TRUSTED_ACTORS on the routing repo + ensure its agent-router pin is @v3.4.1+ (academic-
  # resume is @v3.3.0 today — bump like macf#772, or it stays github-hosted).
  - name: cv
    registry: groundnuty/groundnuty
    var_source: groundnuty/academic-resume
    shared_vars: [MACF_TRUSTED_ACTORS]
    runners:
      - name: academic-resume
        repo: groundnuty/academic-resume
        visibility: private
        status: ready            # cv-architect's GitHub routing side (workspace academic-cv pushes
                                 # here); routes via Agent Router @v3.3.0 (needs @v3.4.1 bump to self-host).
        note: "CV fleet routing repo (cv-architect). private = no fork surface. Deploy:
          make runner-academic-resume. Self-hosting also needs MACF_TRUSTED_ACTORS set here +
          the agent-router pin bumped @v3.3.0 -> @v3.4.1 (else routing stays github-hosted)."
  # ── icsoc fleet (icsoc-2026 paper project). All private. Added 2026-07-05. ──
  - name: icsoc
    registry: groundnuty/groundnuty
    var_source: groundnuty/icsoc-2026-science-agent
    shared_vars: [MACF_TRUSTED_ACTORS]
    runners:
      - name: icsoc-2026-science-agent
        repo: groundnuty/icsoc-2026-science-agent
        visibility: private
        status: ready            # routes via Agent Router @v3 (floating → already origin-routing-capable)
        note: "icsoc science-agent; routes @v3. private = no fork surface. Deploy:
          make runner-icsoc-2026-science-agent. Needs MACF_TRUSTED_ACTORS set to self-host."
      - name: icsoc-2026-code-agent
        repo: groundnuty/icsoc-2026-code-agent
        visibility: private
        status: ready            # ⚠ ROUTING UNCONFIRMED — local workspace has NO .github/workflows;
                                 # verify the GitHub repo runs the Agent Router before deploying (else idle).
        note: "icsoc code-agent. Confirm it routes (Agent Router) GitHub-side before provisioning —
          bot isn't installed here so I couldn't read it. If it doesn't route, the runner sits idle."
      - name: icsoc-2026-paper
        repo: groundnuty/icsoc-2026-paper
        visibility: private
        status: ready            # ⚠ ROUTING UNCONFIRMED — this is the GitHub MIRROR of the Overleaf paper;
                                 # local copy has no agent-router. Verify GitHub-side routing before deploy.
        note: "icsoc paper-agent (GitHub mirror of the Overleaf project). Confirm it routes before
          provisioning — else idle. Deploy: make runner-icsoc-2026-paper."
